<!--
  Python renders this page when an address does not match an existing page.
  The response uses status 404 even though it has the normal site header and footer.
  Para may way back home ang visitor at tama ang status na nakikita ng browser.
-->
{% extends 'base.html' %}
{% block content %}<section class="container page-heading"><h1>A little lost?</h1><p>This page isn't here. Let's get you back to a brighter place.</p><a class="button" href="/">Back home<img src="/static/icons/arrow-up-right.svg" alt=""></a></section>{% endblock %}
