# Vercel reads this to find Python. Para alam nito kung saan magsisimula.
[project]
name = "bright-smile-clinic"
version = "1.0.0"
requires-python = ">=3.12"
# Vercel installs this list for the app. Dapat pareho sa requirements.txt.
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "tzdata==2026.5",
]

[tool.vercel]
entrypoint = "app:app"
